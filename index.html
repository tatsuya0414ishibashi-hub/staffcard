:12px 0 4px}.photo-option input{width:18px;height:18px;margin:0;accent-color:#167b46}@media(max-width:720px){main{grid-template-columns:minmax(0,1fr);margin:16px auto;padding:0 12px;gap:16px}section{min-width:0;padding:16px}input,textarea,select{min-width:0;font-size:16px}input[type=range]{min-height:44px}header{padding:18px 16px;font-size:22px}.photo-option{min-height:44px}small{overflow-wrap:anywhere}}@media(max-width:350px){.name-fields{grid-template-columns:1fr}}.preview{align-self:start;position:sticky;top:12px}.preview canvas{width:auto;max-width:100%;max-height:clamp(180px,48vh,520px);margin:0 auto;object-fit:contain;aspect-ratio:1000/1166}.adjustments{margin-top:12px;padding:12px;background:#f3f6f4;border-radius:10px}.adjustments h3{font-size:16px;margin:0 0 4px}.adjustments label{display:flex;justify-content:space-between;margin:8px 0 0;font-size:14px}.adjustments input[type=range]{display:block;height:44px;min-height:44px;accent-color:#167b46}.adjustments output{font-variant-numeric:tabular-nums}.adjustments button{margin-top:6px;padding:9px;background:#e1ebe5;color:#18372b;font-size:14px}@media(max-width:720px){.preview{position:static}.preview canvas{max-height:clamp(140px,40vh,420px)}.adjustments input[type=range]{height:44px;min-height:44px}} @media(min-width:721px){.preview canvas{width:100%;height:auto;max-height:none;max-width:min(100%, calc(62vh * 1000 / 1166));}} </style><header>スタッフカードメーカー</header><main><section><h2>01　スタッフ情報</h2><label for="file">顔写真</label><input id="file" type="file" accept="image/png,image/jpeg"><div class="name-fields"><div><label for="surname">苗字（姓）</label><input id="surname" placeholder="山田" maxlength="15" autocomplete="off" spellcheck="false"></div><div><label for="givenName">名前（名）</label><input id="givenName" placeholder="太郎" maxlength="15" autocomplete="off" spellcheck="false"></div></div><label for="faculty">学部</label><select id="faculty"><option value="#147c49">現代社会学部</option><option value="#b09c58">国際日本学部</option><option value="#79738f">建築＆芸術学部</option><option value="#ff91b4">経営学部</option><option value="#14afa1">健康栄養学部</option><option value="#d91d23">国際看護学部</option><option value="#4bb5cf">人間情報学部（新設予定）</option></select><small>学部を選ぶとカードの色が自動で変わります。</small><label for="subject">対応科目</label><input autocomplete="off" spellcheck="false" id="subject" placeholder="情報専攻" maxlength="24"><label for="msg">ひとこと</label><textarea autocomplete="off" spellcheck="false" id="msg" rows="4" maxlength="150" placeholder="よろしくお願いします！"></textarea><small>文章の区切りを優先して自然に改行し、文字サイズと行間を自動調整します。</small><label for="color">学部カラー</label><input id="color" type="color" disabled value="#147c49"><small>JPEG・PNGのみ、10MB以下、最大1600万画素・各辺8000px以下。写真は外部に送信されません。</small><small>本人の同意を得て写真を使用してください。共用端末では作業後に消去してください。</small><button type="button" id="clear">個人情報・写真を消去</button><p id="securityStatus" role="status"></p></section><section class="preview"><h2>02　完成プレビュー</h2><canvas aria-label="スタッフカード完成プレビュー" id="card" width="1000" height="1166"></canvas><div class="adjustments"><h3>写真の位置・拡大調整</h3><small>完成プレビューを見ながら調整できます。</small><label for="zoom">写真の拡大<output id="zoomValue" for="zoom">100%</output></label><input id="zoom" type="range" min="1" max="3" step=".01" value="1"><label for="px">写真の左右位置<output id="pxValue" for="px">50</output></label><input id="px" type="range" min="0" max="100" value="50"><label for="py">写真の上下位置<output id="pyValue" for="py">50</output></label><input id="py" type="range" min="0" max="100" value="50"><button type="button" id="resetPosition">写真の位置・拡大率をリセット</button></div><label class="photo-option"><input id="includeName" type="checkbox">保存ファイル名に氏名を含める</label><button id="save">PNG画像を保存</button><small>保存サイズ：1000 × 1166 px</small></section></main><script>const $=id=>document.getElementById(id),c=$('card'),g=c.getContext('2d');let photo=null, loading=false, frame=0, cachedMessage=null, cachedLayout=null;const limited=(id,n)=>Array.from($(id).value).slice(0,n).join('');const fullName=()=>[limited('surname',15).trim(),limited('givenName',15).trim()].filter(Boolean).join(' ');function box(x,y,w,h,r,fill,stroke){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=4;g.stroke()}}function font(n,b=false){g.font=`${b?'bold ':''}${n}px "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif`}const segmenter=typeof Intl.Segmenter==='function'?new Intl.Segmenter('ja',{granularity:'word'}):null;
function wrap(s,w){const out=[],noStart='、。，．！？：；）］】」』〉》〕ぁぃぅぇぉっゃゅょー…',noEnd='（［【「『〈《〔';for(const p of s.split('\n')){const a=Array.from(p);if(!a.length){out.push('');continue}const boundaries=new Set();if(segmenter)for(const part of segmenter.segment(p))boundaries.add(Array.from(p.slice(0,part.index)).length);let i=0;while(i<a.length){let j=i+1;while(j<=a.length&&g.measureText(a.slice(i,j).join('')).width<=w)j++;let k=Math.max(i+1,j-1);if(k<a.length){for(let b=k;b>i&&b>=k-Math.max(1,Math.floor((k-i)*.25));b--){if(!noStart.includes(a[b])&&!noEnd.includes(a[b-1])&&(boundaries.has(b)||/[、。！？\s]/.test(a[b-1]))){k=b;break}}}out.push(a.slice(i,k).join(''));i=k}}return out}
function fitMessage(msg){if(!msg)return null;g.textAlign='center';g.textBaseline='alphabetic';let best=null;function trial(sz){font(sz);const lines=wrap(msg,864);const metrics=lines.map(t=>g.measureText(t||'あ'));const ascent=Math.max(sz*.9,...metrics.map(m=>m.actualBoundingBoxAscent||0)),descent=Math.max(sz*.25,...metrics.map(m=>m.actualBoundingBoxDescent||0));const step=ascent+descent+Math.max(4,sz*.08);const height=ascent+descent+(lines.length-1)*step;if(height>258||metrics.some(m=>Math.max(m.width/2,m.actualBoundingBoxLeft||0,m.actualBoundingBoxRight||0)>432))return null;return {sz,lines,step,ascent,descent}}let lo=1,hi=220;while(lo<=hi){const mid=(lo+hi)>>1,fit=trial(mid);if(fit){best=fit;lo=mid+1}else hi=mid-1}return best}function draw(){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation="source-over";for(const id of ['zoom','px','py'])$(id+'Value').textContent=id==='zoom'?Math.round(Number($(id).value)*100)+'%':$(id).value;g.clearRect(0,0,c.width,c.height);box(0,0,1000,1166,24,$('color').value);const x=29,y=29,w=946,h=657;g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.fillStyle='#bfbfbf';g.fillRect(x,y,w,h);if(photo){let z=Math.max(w/photo.width,h/photo.height)*Number($('zoom').value),pw=photo.width*z,ph=photo.height*z;g.drawImage(photo,x+(w-pw)*$('px').value/100,y+(h-ph)*$('py').value/100,pw,ph)}else{g.fillStyle='#fff';font(160,true);g.textAlign='center';g.textBaseline='middle';g.fillText('写真',x+w/2,y+h/2)}g.restore();g.strokeStyle='#000';g.lineWidth=3.5;g.strokeRect(x,y,w,h);let sub=Array.from(limited('subject',24).trim());if(sub.length){let rows=Math.min(sub.length,8),cols=Math.ceil(sub.length/rows),bw=Math.max(140,cols*72+30),bh=Math.min(578,Math.max(405,rows*81+12)),size=Math.min(94, (bh-28)/rows*.83, (bw-22)/cols*.85),step=Math.min(size*1.42,(bh-24)/rows),right=940,top=87;box(right-bw,top,bw,bh,24,'#fff','#000');g.fillStyle='#000';font(size,true);g.textAlign='center';g.textBaseline='middle';sub.forEach((ch,i)=>{let col=Math.floor(i/rows),count=Math.min(rows,sub.length-col*rows);g.fillText(ch,right-bw*(col+.5)/cols,top+bh/2+((i%rows)-(count-1)/2)*step)})}g.fillStyle='#fff';g.textAlign='left';g.textBaseline='middle';let n=fullName()||'名前';font(106,true);while(g.measureText(n).width>946&&parseInt(g.font.match(/\d+/)[0])>8){font(parseInt(g.font.match(/\d+/)[0])-2,true)}g.fillText(n,29,773);box(29,842,946,301,51,'#fff','#000');g.fillStyle='#000';let msg=limited('msg',150).replace(/\\n/g,'\n').trim().replace(/\n[ \t]*\n+/g,'\n'),layout=msg===cachedMessage?cachedLayout:(cachedLayout=fitMessage(msg)||fitMessage(msg.replace(/\n/g,' ')),cachedMessage=cachedLayout?msg:null,cachedLayout);if(layout){const {sz,lines,step,ascent,descent}=layout;font(sz);g.textAlign='center';g.textBaseline='alphabetic';const first=992.5-(ascent+descent+(lines.length-1)*step)/2+ascent;g.save();g.beginPath();g.roundRect(32,845,940,295,48);g.clip();g.fillStyle="#000";lines.forEach((t,i)=>g.fillText(t,502,first+i*step));g.restore()}}function scheduleDraw(){if(!frame)frame=requestAnimationFrame(()=>{frame=0;draw()})}for(let id of ['surname','givenName','subject','msg','color','zoom','px','py'])$(id).addEventListener('input',scheduleDraw);for(const event of ['compositionend','change','keyup'])$('msg').addEventListener(event,scheduleDraw);$('faculty').addEventListener('change',()=>{$('color').value=$('faculty').value;draw()});let generation=0, saving=false;const status=t=>{$('securityStatus').textContent=t};
function dimensions(buf){const v=new DataView(buf),n=v.byteLength;if(n>=33&&v.getUint32(0)===0x89504e47&&v.getUint32(4)===0x0d0a1a0a&&v.getUint32(8)===13&&v.getUint32(12)===0x49484452){if(v.getUint8(24)!==8&&v.getUint8(24)!==16&&![1,2,4].includes(v.getUint8(24)))throw Error('PNG形式が不正です');return [v.getUint32(16),v.getUint32(20),'image/png']}if(n>4&&v.getUint16(0)===0xffd8){let i=2;while(i+4<=n){if(v.getUint8(i++)!==255)break;while(i<n&&v.getUint8(i)===255)i++;if(i>=n)break;const m=v.getUint8(i++);if(m===0xda||m===0xd9||i+2>n)break;const len=v.getUint16(i);if(len<2||i+len>n)break;if([192,193,194].includes(m)&&len>=8)return [v.getUint16(i+5),v.getUint16(i+3),'image/jpeg'];i+=len}}throw Error('対応するJPEG・PNG画像を選択してください')}
$('file').onchange=async()=>{const ticket=++generation,f=$('file').files[0];if(!f)return;loading=true;$('save').disabled=true;discardPhoto();draw();status('写真を読み込み中…');let bitmap;try{if(f.size>10*1024*1024||!f.size)throw Error('画像は10MB以下にしてください');const buf=await f.arrayBuffer();const [w,h,type]=dimensions(buf);if(!w||!h||w>8000||h>8000||w*h>16000000)throw Error('画像サイズが上限を超えています');if(ticket!==generation)return;bitmap=await createImageBitmap(new Blob([buf],{type}));if(ticket!==generation)return;if(bitmap.width>8000||bitmap.height>8000||bitmap.width*bitmap.height>16000000)throw Error('画像サイズが上限を超えています');const clean=document.createElement('canvas'),scale=Math.min(1,2000/Math.max(bitmap.width,bitmap.height));clean.width=Math.max(1,Math.round(bitmap.width*scale));clean.height=Math.max(1,Math.round(bitmap.height*scale));clean.getContext('2d').drawImage(bitmap,0,0,clean.width,clean.height);photo=clean;cachedMessage=null;cachedLayout=null;draw();scheduleDraw();status('写真を読み込みました')}catch(e){if(ticket===generation)status(e instanceof Error && /^(画像|対応|PNG)/.test(e.message)?e.message:'画像を読み込めませんでした')}finally{if(bitmap)bitmap.close();if(ticket===generation){$('file').value='';loading=false;$('save').disabled=saving}}};

$('clear').onclick=()=>{generation++;loading=false;$('save').disabled=saving;discardPhoto();cachedMessage=null;cachedLayout=null;$('includeName').checked=false;for(const [id,v] of Object.entries({zoom:1,px:50,py:50}))$(id).value=v;for(const id of ['surname','givenName','subject','msg','file'])$(id).value='';$('faculty').selectedIndex=0;$('color').value=$('faculty').value;draw();status('画面上の個人情報を消去しました。保存済み画像は別途削除してください。')};
$('resetPosition').onclick=()=>{for(const [id,v] of Object.entries({zoom:1,px:50,py:50}))$(id).value=v;draw()};$('save').onclick=()=>{if(loading||saving)return;draw();saving=true;$('save').disabled=true;const ticket=generation;const name=$('includeName').checked?fullName():'';c.toBlob(b=>{saving=false;$('save').disabled=loading;if(ticket!==generation)return;if(!b){status('画像の保存に失敗しました');return;}let a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download=(name.replace(/[\x00-\x1f\x7f<>:\x22/\\|?*\u202a-\u202e\u2066-\u2069]/g,'_').replace(/^[. ]+|[. ]+$/g,'')||'staff')+'_card.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)},'image/png')};draw();</script></html>
